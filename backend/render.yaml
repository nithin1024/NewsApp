services:
  - type: web
    name: newstelugu-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./newstelugu.db
      - key: JWT_SECRET
        generateValue: true
